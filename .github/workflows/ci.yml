name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: carbonbox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbonbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carbonbox_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-backend-${{ hashFiles('backend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-backend-
      - uses: actions/setup-node@v4
        with:
          node-version: 26.2
      - name: Install locked dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: backend
        run: bun run typecheck
      - name: Unit tests with coverage
        working-directory: backend
        run: bun run db:deploy && bun run test:coverage:all
      - name: Integration tests
        working-directory: backend
        run: bun run test:integration
      - name: Publish backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
      - name: Add backend checks summary
        if: always()
        run: |
          {
            echo '## Backend checks'
            echo '- Locked install and checks: see step outcomes'
            echo '- Typecheck, unit/coverage and PostgreSQL integration results: see job steps'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-frontend-
      - uses: actions/setup-node@v4
        with:
          node-version: 26.2
      - name: Install locked dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run build && bunx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: bun run test
      - name: Add frontend checks summary
        if: always()
        run: |
          {
            echo '## Frontend checks'
            echo '- Locked install, lint, typecheck, tests and production build: see job steps'
          } >> "$GITHUB_STEP_SUMMARY"

  specifications:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.2
      - name: Validate specifications and active changes
        run: npx --yes @fission-ai/openspec@latest validate --all --strict --no-interactive

  containers:
    name: Container build and smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: carbonbox-ci-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
      POSTGRES_PORT: 25432
      API_PORT: 23001
      FRONTEND_PORT: 23000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:23001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API, worker and frontend images
        run: docker compose build migrate api worker frontend
      - name: Start owned stack
        run: docker compose up -d --wait --wait-timeout 180 postgres migrate api worker frontend
      - name: Smoke test readiness and CSV processing
        env:
          API_BASE_URL: http://127.0.0.1:23001
        run: bash scripts/container-smoke.sh
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop owned stack
        if: always()
        run: docker compose down --volumes --remove-orphans
