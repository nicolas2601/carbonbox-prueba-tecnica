<svg id="carbonbox-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" role="img" aria-label="CarbonBox">
  <defs>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFC27A"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0B5E57"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- box: open top -->
  <path d="M24 22 6 14v20l18 10z" fill="url(#left)"/>
  <path d="M24 22 42 14v20L24 44z" fill="url(#right)"/>
  <path d="M6 14 24 22 42 14 24 6z" fill="#0D1113" fill-opacity=".92"/>
  <path d="M6 14 24 22 42 14 24 6z" fill="none" stroke="#5EEAD4" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/>
  <!-- leaf growing out of the box -->
  <path d="M24 21C15 17.5 15.5 8 30 3.5 32.5 12.5 30.5 18.5 24 21z" fill="url(#leaf)"/>
  <path d="M24 21C25.5 15.5 27.5 10.5 30 6" fill="none" stroke="#0D1113" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
</svg>
